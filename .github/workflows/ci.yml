name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem bin,ops -Recurse -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            foreach ($errorItem in @($errors)) {
              $failures += "$($_.FullName):$($errorItem.Extent.StartLineNumber): $($errorItem.Message)"
            }
          }
          $failures | ForEach-Object { Write-Error $_ }
          if ($failures.Count -gt 0) { throw "PowerShell parse failures: $($failures.Count)" }

      - name: PSScriptAnalyzer report
        continue-on-error: true
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber
          Invoke-ScriptAnalyzer -Path bin,ops -Recurse -Severity Warning |
            Format-Table -AutoSize | Out-String | Write-Host

      - name: Run repository verification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$PWD/.ci-runtime" | Out-Null
          & ./ops/verify-windows.ps1 -Root "$PWD/.ci-runtime"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Defensive bridge invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'boot-tmux|pleiades-analysis|--bind-ro=/mnt/c|ErrorActionPreference[[:space:]]*=[[:space:]]*.[Cc]ontinue' bin ops README.md
          grep -Fq "schema = 'pleiades.event/v1'" bin/pleiades-collector.ps1
          grep -Fq "schema = 'pleiades.event/v1'" bin/pleiades-netwatch.ps1
          grep -Fq 'pleiades.windows-security-cursor/v1' bin/pleiades-collector.ps1
          grep -Fq '[switch]$AcceptLogReset' bin/pleiades-collector.ps1
          grep -Fq 'collection_epoch' bin/pleiades-collector.ps1
          grep -Fq 'legacy collector cursor is corrupt; refusing implicit replay' bin/pleiades-collector.ps1
          ! grep -Fq 'Set-Content -Path $cursorFile' bin/pleiades-collector.ps1
          grep -Fq 'pleiades.status/v1' bin/pleiades-snapshot.sh
          grep -Fq 'if ($script:Fail -gt 0) { exit 1 }' ops/verify-windows.ps1
