name: Validate exact status snapshot

on:
  pull_request:
    paths:
      - 'bin/pleiades-supervisor.ps1'
      - 'bin/pleiades-snapshot.sh'
      - 'ops/test-status-snapshot.ps1'
      - '.github/workflows/status-contract.yml'
  push:
    branches: [main]
    paths:
      - 'bin/pleiades-supervisor.ps1'
      - 'bin/pleiades-snapshot.sh'
      - 'ops/test-status-snapshot.ps1'
      - '.github/workflows/status-contract.yml'

permissions:
  contents: read

concurrency:
  group: pleiades-windows-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status-contract:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Parse PowerShell status surfaces
        shell: pwsh
        run: |
          $failures = @()
          foreach ($path in 'bin/pleiades-supervisor.ps1','ops/test-status-snapshot.ps1') {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path),
              [ref]$tokens,
              [ref]$errors
            )
            foreach ($errorItem in @($errors)) {
              $failures += "$path`:$($errorItem.Extent.StartLineNumber): $($errorItem.Message)"
            }
          }
          $failures | ForEach-Object { Write-Error $_ }
          if ($failures.Count -gt 0) { throw "PowerShell parse failures: $($failures.Count)" }
      - id: fixtures
        name: Capture exact-object adversarial fixtures
        shell: pwsh
        run: |
          $status = 0
          try {
            & ./ops/test-status-snapshot.ps1 *>&1 |
              Tee-Object -FilePath status-contract.log | Write-Host
            if ($LASTEXITCODE -ne 0) { $status = $LASTEXITCODE }
          } catch {
            $status = 1
            ($_ | Format-List * -Force | Out-String) |
              Add-Content -LiteralPath status-contract.log -Encoding utf8
          }
          if (Test-Path -LiteralPath status-contract.log) {
            Get-Content -LiteralPath status-contract.log | Write-Host
          }
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0
      - id: identity
        name: Capture producer and consumer schema identity
        shell: pwsh
        run: |
          $status = 0
          try {
            $producer = Get-Content -LiteralPath bin/pleiades-snapshot.sh -Raw
            $consumer = Get-Content -LiteralPath bin/pleiades-supervisor.ps1 -Raw
            if (-not $producer.Contains('"schema": "pleiades.status/v1"')) { throw 'producer schema identity missing' }
            if (-not $consumer.Contains("'pleiades.status/v1'")) { throw 'consumer schema identity missing' }
            if (-not $consumer.Contains('Assert-NoDuplicateJsonProperties')) { throw 'duplicate-key validation missing' }
            if (-not $consumer.Contains('Assert-ExactJsonProperties')) { throw 'exact-object validation missing' }
            'PASS: producer and consumer schema identity' | Set-Content -LiteralPath status-identity.log -Encoding utf8
          } catch {
            $status = 1
            ($_ | Format-List * -Force | Out-String) | Set-Content -LiteralPath status-identity.log -Encoding utf8
          }
          Get-Content -LiteralPath status-identity.log | Write-Host
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0
      - name: Upload exact status diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pleiades-windows-status-${{ github.sha }}
          path: |
            status-contract.log
            status-identity.log
          if-no-files-found: error
          retention-days: 14
      - name: Enforce exact status gate
        if: always()
        shell: pwsh
        env:
          FIXTURE_STATUS: ${{ steps.fixtures.outputs.status }}
          IDENTITY_STATUS: ${{ steps.identity.outputs.status }}
        run: |
          if ($env:FIXTURE_STATUS -ne '0') { throw 'exact-object status fixtures failed' }
          if ($env:IDENTITY_STATUS -ne '0') { throw 'producer/consumer schema identity failed' }
